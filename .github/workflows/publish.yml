name: Release

on:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/publish.yml
      - scripts/verify-release.mjs
      - scripts/release/**
      - .github/docs/macos-release.md
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/tauri.conf.json
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      signed_macos:
        description: Require Apple signing and notarization (fails if secrets are missing)
        type: boolean
        default: false
      create_release:
        description: Create or update a draft release from main after all packages pass
        type: boolean
        default: true
  pull_request:
    branches: ["main"]
    paths:
      - .github/workflows/publish.yml
      - scripts/verify-release.mjs
      - scripts/release/**
      - .github/docs/macos-release.md

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-26-intel
            target: x86_64-apple-darwin
            bundles: app,dmg

    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils libglib2.0-bin file

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify manifests and native architecture
        run: node scripts/verify-release.mjs

      - name: Frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust library tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --test native_safety

      - name: Configure macOS signing
        id: macos-signing
        if: startsWith(matrix.target, 'aarch64-apple-') || startsWith(matrix.target, 'x86_64-apple-')
        shell: bash
        env:
          REQUIRE_SIGNING: ${{ inputs.signed_macos == true }}
          PREVIEW_ONLY: ${{ github.event_name == 'pull_request' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ "$REQUIRE_SIGNING" == "true" ]] && (( ${#missing[@]} )); then
            echo "::error::Requested signed macOS build requires repository secrets: ${missing[*]}. See .github/docs/macos-release.md."
            exit 1
          fi
          if [[ "$PREVIEW_ONLY" != "true" ]] && (( ${#missing[@]} == 0 )); then
            [[ "$APPLE_SIGNING_IDENTITY" == 'Developer ID Application:'* ]] || { echo '::error::Use a Developer ID Application certificate for direct distribution.'; exit 1; }
            [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo '::error::APPLE_TEAM_ID must contain ten uppercase letters or digits.'; exit 1; }
            printf 'APPLE_SIGNING_IDENTITY=%s\n' "$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo 'notarized=true' >> "$GITHUB_OUTPUT"
          else
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            echo 'notarized=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Building ad-hoc macOS installers without Apple notarization; the draft release will label this explicitly.'
          fi

      - name: Build ad-hoc macOS installers
        if: runner.os == 'macOS' && steps.macos-signing.outputs.notarized != 'true'
        shell: bash
        run: |
          # Tauri treats even empty certificate variables as a certificate import.
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          npm run tauri build -- --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked

      - name: Build native installers
        if: runner.os != 'macOS' || steps.macos-signing.outputs.notarized == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          APPLE_CERTIFICATE: ${{ steps.macos-signing.outputs.notarized == 'true' && runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.macos-signing.outputs.notarized == 'true' && runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ steps.macos-signing.outputs.notarized == 'true' && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ steps.macos-signing.outputs.notarized == 'true' && runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.macos-signing.outputs.notarized == 'true' && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - run: node scripts/verify-release.mjs --artifacts
      - name: Verify macOS disk image, signature, notarization and launch
        if: runner.os == 'macOS'
        env:
          REQUIRE_NOTARIZATION: ${{ steps.macos-signing.outputs.notarized == 'true' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release/verify-macos.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
      - name: Save macOS verification evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-verification-${{ matrix.target }}
          if-no-files-found: warn
          path: qa-output/release/**

  draft-release:
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093b # v4
        with:
          pattern: packages-*
          path: packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093b # v4
        with:
          pattern: macos-verification-*
          path: verification
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = 'v' + version;
            if (context.ref.startsWith('refs/tags/') && context.ref !== 'refs/tags/' + tag) {
              throw new Error('Release tag does not match package version');
            }
            const reports = ['aarch64-apple-darwin', 'x86_64-apple-darwin'].map(target => {
              const report = JSON.parse(fs.readFileSync(path.join('verification', 'macos-verification-' + target, 'verification.json'), 'utf8'));
              if (report.target !== target || !report.passed) throw new Error('Missing passing macOS verification for ' + target);
              return report;
            });
            const macosNotice = reports.every(report => report.notarizationRequired)
              ? 'macOS Intel and Apple silicon packages passed Developer ID signature, notarization, Gatekeeper, disk-image integrity and launch checks.'
              : 'macOS packages use ad-hoc signatures and are NOT Apple notarized. Gatekeeper may block installation; they passed signature integrity, native architecture, disk-image integrity and launch checks. See .github/docs/macos-release.md for installation and signing guidance.';
            const packages = [];
            for (const group of fs.readdirSync('packages')) {
              for (const file of fs.readdirSync(path.join('packages', group), { recursive: true })) {
                if (!/\.(deb|AppImage|dmg|msi|exe)$/.test(file)) continue;
                const full = path.join('packages', group, file);
                if (!fs.statSync(full).isFile()) continue;
                packages.push({ name: group.slice('packages-'.length) + '-' + path.basename(file), data: fs.readFileSync(full) });
              }
            }
            if (packages.length !== 6) throw new Error('Expected six installers from four native builds; found ' + packages.length);
            const checksums = packages.map(p => crypto.createHash('sha256').update(p.data).digest('hex') + '  ' + p.name).join('\n') + '\n';
            const releaseOptions = {
              ...context.repo, tag_name: tag, name: 'File2File ' + tag,
              target_commitish: context.sha, draft: true,
              body: macosNotice + '\n\nExternal conversion engines are not bundled. Windows and Linux packages are unsigned. Install and smoke-test each native package before publishing this draft. See README.md and .github/docs/macos-release.md.'
            };
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!release.data.draft) throw new Error('Refusing to replace assets on an already-published release');
              release = await github.rest.repos.updateRelease({
                ...releaseOptions, release_id: release.data.id
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                ...releaseOptions, generate_release_notes: true
              });
            }
            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.data.id, per_page: 100
            });
            for (const existing of existingAssets) {
              await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: existing.id });
            }
            for (const asset of [...packages, { name: 'SHA256SUMS.txt', data: Buffer.from(checksums) }]) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.data.id, ...asset,
                headers: { 'content-type': asset.name.endsWith('.txt') ? 'text/plain' : 'application/octet-stream' }
              });
            }
