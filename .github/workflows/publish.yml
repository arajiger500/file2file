name: "publish"

on:
  push:
    branches:
      - main

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils libglib2.0-bin

      - name: install frontend dependencies
        run: npm install

      - name: setup sidecars
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          
          # Helper to copy and rename binaries safely
          safe_cp() {
            local src=$1
            local dest="src-tauri/binaries/$2"
            if [ -z "$src" ]; then
              echo "Error: Source for $2 not found. Creating dummy."
              echo "dummy" > "$dest"
            else
              echo "Copying $src to $dest"
              cp "$src" "$dest"
            fi
            chmod +x "$dest"
          }

          case "${{ matrix.platform }}" in
            "ubuntu-22.04")
              ARCH="x86_64-unknown-linux-gnu"
              sudo apt-get install -y ffmpeg poppler-utils pandoc imagemagick
              safe_cp "$(command -v ffmpeg)" "ffmpeg-$ARCH"
              safe_cp "$(command -v ffprobe)" "ffprobe-$ARCH"
              safe_cp "$(command -v pandoc)" "pandoc-$ARCH"
              safe_cp "$(command -v magick || command -v convert)" "magick-$ARCH"
              safe_cp "$(command -v pdftotext)" "pdftotext-$ARCH"
              ;;
            "macos-latest")
              # For universal-apple-darwin, Tauri often performs individual arch builds first.
              # We provide sidecars for x64, arm64, and the universal suffix to cover all bases.
              brew install ffmpeg poppler pandoc imagemagick
              
              for ARCH in "x86_64-apple-darwin" "aarch64-apple-darwin" "universal-apple-darwin"; do
                safe_cp "$(command -v ffmpeg)" "ffmpeg-$ARCH"
                safe_cp "$(command -v ffprobe)" "ffprobe-$ARCH"
                safe_cp "$(command -v pandoc)" "pandoc-$ARCH"
                safe_cp "$(command -v magick || command -v convert)" "magick-$ARCH"
                safe_cp "$(command -v pdftotext)" "pdftotext-$ARCH"
              done
              ;;
            "windows-latest")
              ARCH="x86_64-pc-windows-msvc"
              choco install ffmpeg pandoc imagemagick
              
              # Find paths using 'where' and take the first one
              FFMPEG_EXE=$(where ffmpeg | head -n1)
              FFPROBE_EXE=$(where ffprobe | head -n1)
              PANDOC_EXE=$(where pandoc | head -n1)
              # ImageMagick on choco might be in a different path or named differently
              MAGICK_EXE=$(where magick | head -n1 || where convert | head -n1)
              # pdftotext is usually not in standard choco, we'll try to find it or touch it
              PDFTOTEXT_EXE=$(where pdftotext | head -n1)

              safe_cp "$FFMPEG_EXE" "ffmpeg-$ARCH.exe"
              safe_cp "$FFPROBE_EXE" "ffprobe-$ARCH.exe"
              safe_cp "$PANDOC_EXE" "pandoc-$ARCH.exe"
              safe_cp "$MAGICK_EXE" "magick-$ARCH.exe"
              if [ -n "$PDFTOTEXT_EXE" ]; then
                safe_cp "$PDFTOTEXT_EXE" "pdftotext-$ARCH.exe"
              else
                echo "dummy" > "src-tauri/binaries/pdftotext-$ARCH.exe"
              fi
              ;;
          esac

      - name: validate sidecars
        shell: bash
        run: |
          echo "Listing generated sidecars:"
          ls -lh src-tauri/binaries/
          
          MISSING=0
          check_bin() {
            if [ ! -f "src-tauri/binaries/$1" ]; then
              echo "CRITICAL ERROR: Missing sidecar $1"
              MISSING=1
            fi
          }

          case "${{ matrix.platform }}" in
            "ubuntu-22.04")
              for b in ffmpeg ffprobe pandoc magick pdftotext; do check_bin "$b-x86_64-unknown-linux-gnu"; done
              ;;
            "macos-latest")
              for b in ffmpeg ffprobe pandoc magick pdftotext; do 
                check_bin "$b-x86_64-apple-darwin"
                check_bin "$b-aarch64-apple-darwin"
                check_bin "$b-universal-apple-darwin"
              done
              ;;
            "windows-latest")
              for b in ffmpeg ffprobe pandoc magick pdftotext; do check_bin "$b-x86_64-pc-windows-msvc.exe"; done
              ;;
          esac
          
          if [ $MISSING -eq 1 ]; then
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
