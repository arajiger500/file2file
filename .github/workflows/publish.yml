name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-26
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-26-intel
            target: x86_64-apple-darwin
            bundles: dmg

    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils libglib2.0-bin file

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify manifests and native architecture
        run: node scripts/verify-release.mjs

      - name: Frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust library tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --test native_safety

      - name: Build native installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - run: node scripts/verify-release.mjs --artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe

  draft-release:
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093b # v4
        with:
          pattern: packages-*
          path: packages
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const tag = context.ref.slice('refs/tags/'.length);
            const packages = [];
            for (const group of fs.readdirSync('packages')) {
              for (const file of fs.readdirSync(path.join('packages', group), { recursive: true })) {
                if (!/\.(deb|AppImage|dmg|msi|exe)$/.test(file)) continue;
                const full = path.join('packages', group, file);
                if (!fs.statSync(full).isFile()) continue;
                packages.push({ name: group.slice('packages-'.length) + '-' + path.basename(file), data: fs.readFileSync(full) });
              }
            }
            if (packages.length !== 6) throw new Error('Expected six installers from four native builds; found ' + packages.length);
            const checksums = packages.map(p => crypto.createHash('sha256').update(p.data).digest('hex') + '  ' + p.name).join('\n') + '\n';
            const releaseOptions = {
              ...context.repo, tag_name: tag, name: 'File2File ' + tag,
              target_commitish: context.sha, draft: true,
              body: 'External engines are not bundled. Install and smoke-test each native package before publishing this draft. See README.md. Packages are unsigned unless signing is configured separately.'
            };
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!release.data.draft) throw new Error('Refusing to replace assets on an already-published release');
              release = await github.rest.repos.updateRelease({
                ...releaseOptions, release_id: release.data.id
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                ...releaseOptions, generate_release_notes: true
              });
            }
            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.data.id, per_page: 100
            });
            for (const existing of existingAssets) {
              await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: existing.id });
            }
            for (const asset of [...packages, { name: 'SHA256SUMS.txt', data: Buffer.from(checksums) }]) {
              await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: release.data.id, ...asset });
            }
