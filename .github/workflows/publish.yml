name: "publish"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: ""
          - platform: "macos-13"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils libglib2.0-bin

      - name: install frontend dependencies
        run: npm ci

      - name: setup sidecars
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          
          safe_cp() {
            local src=$1
            local dest="src-tauri/binaries/$2"
            if [ -z "$src" ] || [ ! -f "$src" ]; then
              echo "Error: Required binary source for $2 not found. Failing build."
              exit 1
            else
              echo "Copying $src to $dest"
              cp "$src" "$dest"
            fi
            chmod +x "$dest"
          }

          case "${{ matrix.platform }}" in
            "ubuntu-22.04")
              ARCH="x86_64-unknown-linux-gnu"
              sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils pandoc imagemagick
              safe_cp "$(command -v ffmpeg)" "ffmpeg-$ARCH"
              safe_cp "$(command -v ffprobe)" "ffprobe-$ARCH"
              safe_cp "$(command -v pandoc)" "pandoc-$ARCH"
              MAGICK_PATH="$(command -v magick || command -v convert)"
              safe_cp "$MAGICK_PATH" "magick-$ARCH"
              safe_cp "$(command -v pdftotext)" "pdftotext-$ARCH"
              safe_cp "$(command -v pdftohtml)" "pdftohtml-$ARCH"
              ;;
              
            "macos-latest" | "macos-13")
              ARCH=$(rustc -vV | grep host | awk '{print $2}')
              brew install ffmpeg poppler pandoc imagemagick
              safe_cp "$(brew --prefix ffmpeg)/bin/ffmpeg" "ffmpeg-$ARCH"
              safe_cp "$(brew --prefix ffmpeg)/bin/ffprobe" "ffprobe-$ARCH"
              safe_cp "$(brew --prefix pandoc)/bin/pandoc" "pandoc-$ARCH"
              safe_cp "$(brew --prefix imagemagick)/bin/magick" "magick-$ARCH"
              safe_cp "$(brew --prefix poppler)/bin/pdftotext" "pdftotext-$ARCH"
              safe_cp "$(brew --prefix poppler)/bin/pdftohtml" "pdftohtml-$ARCH"
              ;;
              
            "windows-latest")
              ARCH="x86_64-pc-windows-msvc"
              choco install ffmpeg pandoc imagemagick poppler --no-progress
              
              FFMPEG_PATH=$(where ffmpeg | head -n 1)
              FFPROBE_PATH=$(where ffprobe | head -n 1)
              PANDOC_PATH=$(where pandoc | head -n 1)
              MAGICK_PATH=$(where magick | head -n 1)
              PDFTOTEXT_PATH=$(where pdftotext | head -n 1)
              PDFTOHTML_PATH=$(where pdftohtml | head -n 1)

              safe_cp "$FFMPEG_PATH" "ffmpeg-$ARCH.exe"
              safe_cp "$FFPROBE_PATH" "ffprobe-$ARCH.exe"
              safe_cp "$PANDOC_PATH" "pandoc-$ARCH.exe"
              safe_cp "$MAGICK_PATH" "magick-$ARCH.exe"
              safe_cp "$PDFTOTEXT_PATH" "pdftotext-$ARCH.exe"
              safe_cp "$PDFTOHTML_PATH" "pdftohtml-$ARCH.exe"
              ;;
          esac

      - name: validate sidecars
        shell: bash
        run: |
          echo "Sidecar Manifest:"
          ls -lh src-tauri/binaries/
          
          MISSING=0
          case "${{ matrix.platform }}" in
            "ubuntu-22.04") SUFFIXES=("-x86_64-unknown-linux-gnu") ;;
            "macos-latest" | "macos-13")
              ARCH=$(rustc -vV | grep host | awk '{print $2}')
              SUFFIXES=("-$ARCH")
              ;;
            "windows-latest") SUFFIXES=("-x86_64-pc-windows-msvc.exe") ;;
          esac
          
          for sfx in "${SUFFIXES[@]}"; do
            for bin in ffmpeg ffprobe pandoc magick pdftotext pdftohtml; do
              if [ ! -f "src-tauri/binaries/$bin$sfx" ]; then
                echo "Error: Missing required sidecar $bin$sfx"
                MISSING=1
              fi
            done
          done
          
          [ $MISSING -eq 0 ] || exit 1


      - name: smoke test sidecars
        shell: bash
        run: |
          for bin in src-tauri/binaries/*; do
            if [ -f "$bin" ]; then
              echo "Testing $bin"
              chmod +x "$bin"
              "$bin" -version || "$bin" --version || echo "Failed to get version for $bin"
            fi
          done

      - name: build frontend
        run: npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "File2File Release Build"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
