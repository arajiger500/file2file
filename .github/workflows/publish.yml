# Release builds: push to the release branch creates/updates the v__VERSION__ GitHub Release.
name: Release

on:
  push:
    branches:
      - "release"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-26
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            label: macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils libglib2.0-bin file

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify manifests
        run: |
          test -f package-lock.json
          test -f src-tauri/Cargo.lock
          node -e "const p=require('./package.json'); if(!/^[0-9]+\\.[0-9]+\\.[0-9]+$/.test(p.version)) throw new Error('Invalid package version: '+p.version); console.log('Releasing File2File v'+p.version)"

      - name: Frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: File2File v__VERSION__
          releaseBody: |
            File2File v__VERSION__

            Native desktop packages:
            - Windows x64: NSIS + MSI
            - macOS arm64: DMG
            - macOS x64: DMG
            - Linux x64: AppImage + DEB

            Converter engines are discovered locally. See the README for engine requirements.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadWorkflowArtifacts: true
          releaseAssetNamePattern: File2File-[version]-[platform]-[arch]-[bundle][ext]
